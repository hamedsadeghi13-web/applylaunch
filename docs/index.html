<!-- =====================================================================
 ApplyLaunch - plain prototype v3 (one file: HTML + CSS + vanilla JS)
 - No images, no background art: add your own later (see the CSS comment "ADD YOUR IMAGES HERE").
 - 3 languages: FA (RTL) / EN / TR.
 - Screens: Home, Profile (comprehensive), Explore (results), Saved.
 - The search works for real on SAMPLE data (array POSITIONS below). Replace it with your server/API later.
 - Profile is saved in the browser (localStorage) in this prototype.
 - Numbers at the top of the home page: edit the STATS object.
 ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=DM+Sans:wght@400;500;700&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#111827; --muted:#5b6472; --line:#dfe3e8; --soft:#f6f7f9;
  --accent:#12365a; --accent-ink:#fff; --warn:#b4412b; --ok:#1f6b4a;
  --f-body:'DM Sans','Vazirmatn',sans-serif; --f-head:'Newsreader',serif;
}
html[lang="fa"]{--f-body:'Vazirmatn','DM Sans',sans-serif;--f-head:'Vazirmatn',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--f-head);font-weight:500;line-height:1.2;letter-spacing:-.3px}
html[lang="fa"] h1,html[lang="fa"] h2,html[lang="fa"] h3{font-weight:700;letter-spacing:0;line-height:1.5}
h1{font-size:46px} h2{font-size:30px} h3{font-size:20px}
html[lang="fa"] h1{font-size:36px} html[lang="fa"] h2{font-size:26px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
/* ADD YOUR IMAGES HERE: e.g. .hero{background:url(hero.jpg) center/cover} - nothing is used now */

.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;flex:0 0 200px;padding:24px 16px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{font-family:'Newsreader',serif;font-size:28px;padding:4px 10px 22px;display:block}
.nav{display:block;width:100%;text-align:start;border:0;background:transparent;padding:11px 12px;border-radius:8px;font-size:15px}
.nav:hover{background:var(--soft)} .nav.on{background:var(--soft);font-weight:700}
.tagline{margin-top:auto;padding:12px;font-size:13px;color:var(--muted)}
.main{flex:1 1 0;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:16px 28px}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{border:0;background:transparent;padding:8px 14px;font-size:14px;font-weight:500}
.langs button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:10px 20px;font-weight:700;font-size:15px;min-height:44px}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.link{border:0;background:transparent;text-decoration:underline;padding:6px 4px;min-height:0;font-weight:500}
.wrap{max-width:1000px;margin:0 auto;padding:8px 28px 80px}
.sec{padding:44px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px}
.stats>div{padding:20px 24px;border-inline-start:1px solid var(--line)}
.stats>div:first-child{border-inline-start:0}
.stats b{display:block;font-family:var(--f-head);font-size:34px;font-weight:500;line-height:1.1}
html[lang="fa"] .stats b{font-weight:700}

/* profile call-to-action box */
.pbox{display:block;width:100%;text-align:start;border:2px solid var(--accent);border-radius:14px;padding:28px;background:#fff}
.pbox:hover{background:var(--soft)}
.pbox .row{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:14px;max-width:420px}
.bar i{display:block;height:100%;background:var(--accent)}

/* search bar */
.sbar{display:flex;flex-wrap:wrap;max-width:760px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(17,24,39,.06)}
.sbar:focus-within{border-color:var(--accent)}
.sbar .c{flex:1 1 130px;padding:8px 14px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
.sbar .c.first{flex:2 1 220px;border-inline-start:0}
.sbar label{font-size:11px;color:var(--muted);letter-spacing:.2px}
.sbar input,.sbar select{border:0;outline:0;background:transparent;width:100%;font-weight:500;font-size:14px;min-height:26px}
.sbar .go{flex:0 0 auto;border:0;background:var(--accent);color:#fff;padding:0 24px;font-weight:700;min-height:48px;margin:5px;border-radius:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.tag:hover{border-color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.three p{margin:6px 0 0;color:var(--muted);font-size:15px}
.num{font-family:var(--f-head);font-size:34px;color:var(--accent)}

/* profile form */
.prof{display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start}
.toc{flex:0 0 190px;position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.toc a{padding:7px 10px;border-radius:8px;font-size:14px;color:var(--muted)}
.toc a:hover{background:var(--soft);color:var(--ink)}
.form{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:34px}
.block{border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:12px}
.block>h3{display:flex;gap:10px;align-items:baseline}
.block>h3 span{color:var(--muted);font-size:14px;font-family:var(--f-body);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:700}
.fld input,.fld select,.fld textarea{border:1px solid #b9c0ca;border-radius:8px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.entry{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.entry .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #b9c0ca;background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;min-height:38px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tog{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--ink);padding:14px 0;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;z-index:5}

/* results */
.filters{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 8px}
.filters .fld{flex:1 1 150px}
.card{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.card .head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:16px 18px;cursor:pointer}
.score{flex:0 0 52px;height:52px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)}
.score.mid{border-color:#a66b00;color:#a66b00} .score.low{border-color:#9aa3af;color:#6b7280}
.card .t{flex:1 1 280px;min-width:0}
.card .t b{font-size:17px;display:block;line-height:1.4}
.meta{display:flex;gap:22px;flex-wrap:wrap}
.meta small{display:block;font-size:12px;color:var(--muted)} .meta b{font-size:15px}
.detail{border-top:1px solid var(--line);padding:18px;background:var(--soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fact small{display:block;font-size:12px;color:var(--muted)} .fact b{font-size:15px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.r-ok,.r-warn{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.r-ok{color:var(--ok);border-color:#b8d8c8} .r-warn{color:var(--warn);border-color:#e6bdb2}
.blur{filter:blur(6px);user-select:none}
.pt{display:flex;gap:10px;margin-top:22px}
.pt button{flex:1 1 0;text-align:start;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 18px}
.pt button.on{border:2px solid var(--accent);background:var(--soft)}
.pt b{display:block;font-size:16px} .pt span{font-size:13px;color:var(--muted)}
.flow{display:flex;gap:8px;align-items:stretch;margin:18px 0}
.flow>div:not(.arrow){flex:1 1 0;border:1px solid var(--line);border-radius:12px;padding:14px}
.flow .arrow{flex:0 0 auto;align-self:center;color:var(--muted);font-size:20px}
.flow small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
html[dir=rtl] .flow .arrow{transform:scaleX(-1)}
.wbar{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:14px}
.wbar span:first-child{flex:0 0 150px} .wbar i{display:block;height:14px;background:var(--accent);border-radius:3px}
.wbar span:last-child{flex:1 1 0}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.plan{border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.plan.best{border:2px solid var(--accent)}
.plan ul{margin:0;padding-inline-start:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;flex:1}
.faq{border-top:1px solid var(--line);padding:14px 0}.faq b{display:block}
table.cmp{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
table.cmp td,table.cmp th{border:1px solid var(--line);padding:8px 12px;text-align:start}
table.cmp th{background:var(--soft)}
.gate{border:2px solid var(--accent);border-radius:14px;padding:28px;margin:8px 0 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.empty{border:1px dashed #b9c0ca;border-radius:12px;padding:40px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:22px 28px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:1000px){.plans{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .side{flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:center;border-inline-end:0;border-bottom:1px solid var(--line);padding:10px 14px}
  .main{flex:1 1 100%}
  .side{height:auto;z-index:20;background:#fff;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap} .nav{white-space:nowrap}
  .logo{padding:0 10px 0 0} .nav{width:auto} .tagline{display:none}
  .stats{grid-template-columns:1fr 1fr} .stats>div{border-inline-start:0;border-top:1px solid var(--line)} .stats>div:nth-child(-n+2){border-top:0} .stats>div:nth-child(even){border-inline-start:1px solid var(--line)}
  .pt{flex-direction:column} .plans{grid-template-columns:1fr} .flow{flex-direction:column} .flow .arrow{transform:rotate(90deg);align-self:center}
  .three{grid-template-columns:1fr} .toc{display:none}
  h1{font-size:34px} html[lang="fa"] h1{font-size:28px}
  .top{padding:10px 14px} .wrap{padding:8px 16px 60px}
}
/* v4: combo boxes, notes, field tree, sort */
.cb{position:relative}
.cb input{padding-inline-end:34px}
.cbt{position:absolute;inset-inline-end:0;top:0;height:100%;width:34px;border:0;background:transparent;color:var(--muted);font-size:14px}
.cbl{position:absolute;z-index:30;inset-inline:0;top:calc(100% + 4px);max-height:260px;overflow:auto;background:#fff;border:1px solid var(--ink);border-radius:10px;box-shadow:0 8px 24px rgba(17,24,39,.14);padding:4px}
.cbl[hidden]{display:none}
.cbo{padding:9px 12px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1.4}
.cbo:hover,.cbo.act{background:var(--soft)}
.cbe{padding:8px 12px;font-size:13px;color:var(--muted)}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:10px;padding:14px 18px;margin-top:16px;max-width:760px;background:#fff}
.note b{display:block;margin-bottom:2px}
.note span{font-size:14px;color:var(--muted)}
.addrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.addrow .cb{flex:1 1 280px}
.chip.rm:after{content:" ×";opacity:.7}
.msg{font-size:13px;color:var(--warn);min-height:18px}
.msg.ok{color:var(--ok)}
.rbox{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.rbox label{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.rbox label:last-child{border-bottom:0}
.rbox .rn{flex:0 0 44px;color:var(--accent);font-weight:700}
.rbox input{width:17px;height:17px;accent-color:var(--accent)}
.tree{border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.tn[hidden]{display:none}
.tn .tr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.tn .tl{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-size:15px}
.tn .tl input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.tn[data-l="1"]>.tr .tl span{font-weight:700;font-size:16px}
.tn .tk{display:none;padding-inline-start:26px}
.tn.open>.tk{display:block}
.tx{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:14px;min-width:56px}
.tx small{color:var(--muted);margin-inline-start:6px}
.live .samp{display:none}
.demo{background:#fff4d6;color:#6b4a00;border-bottom:1px solid #f0d48a;padding:9px 18px;font-size:13px;line-height:1.5;text-align:center}
.livenote{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.samp{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-inline-start:8px;vertical-align:middle}
.rankb{display:inline-block;font-weight:700}
.filters .fld.sortf{flex:0 1 240px}
.fsel{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
/* v5: google-style search, universities page */
.gs{display:flex;gap:12px;max-width:820px;align-items:center}
.gs input{flex:1;min-width:0;height:58px;border:1px solid var(--line);border-radius:999px;padding:0 28px;font-size:18px;box-shadow:0 2px 12px rgba(17,24,39,.07);background:#fff}
.gs input:hover{box-shadow:0 2px 14px rgba(17,24,39,.12)}
.gs input:focus{outline:0;border-color:var(--accent);box-shadow:0 2px 14px rgba(18,54,90,.18)}
.gs .go{height:58px;padding:0 34px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;flex:0 0 auto}
.qf{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;max-width:820px}
.qf .fld{flex:1 1 170px}
.qf label{font-size:12px;color:var(--muted)}
.qf select{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-size:14px}
.uwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.uside{border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:16px}
.uside h3{margin-bottom:12px}
.urow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .rk{flex:0 0 46px;font-weight:700;color:var(--accent);font-size:15px}
.urow .rk.none{color:var(--muted);font-weight:400}
.urow .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.urow .nm b{font-size:15px}
.urow a.lk{flex:0 0 auto;font-size:14px;font-weight:600;color:var(--accent);text-decoration:underline;white-space:nowrap}
.logo2{flex:0 0 40px;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--accent);background:var(--soft);overflow:hidden}
.logo2 img{width:100%;height:100%;object-fit:contain}
.uside .urow .logo2{flex:0 0 46px;width:46px;height:46px}
.ucont{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.ulist{border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-top:14px}
@media (max-width:900px){.uwrap{grid-template-columns:1fr}.uside{position:static}.gs{flex-wrap:wrap}.gs .go{flex:1 1 100%}.gs input{flex:1 1 100%;height:52px}}
.urow[hidden]{display:none}
.uwrap1{max-width:1000px}
.wmap{position:relative;max-width:900px;margin:22px 0 4px}
.wmap svg{width:100%;height:auto;display:block}
.wmap .ct{fill:#d9e0ea;stroke:#fff;stroke-width:.6;stroke-linejoin:round;cursor:pointer;transition:fill .15s;outline:0}
.wmap .ct:hover,.wmap .ct:focus-visible{fill:#6f86a8}
.wmap .ct.on{fill:var(--accent)}
.wtip{position:absolute;pointer-events:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;transform:translate(-50%,-140%);z-index:3}
.wcap{font-family:var(--f-head);font-size:22px;margin:4px 0 6px}
.privline{margin:34px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.privline b{font-weight:600}

.nav .ico{display:inline-flex;vertical-align:-4px;margin-inline-end:8px;width:18px;height:18px}
.ico svg{width:18px;height:18px}
.flinks{display:flex;gap:18px;flex-wrap:wrap}
.flink{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px}
.flink:hover{color:var(--ink)}
.pg{max-width:880px;padding-bottom:30px}
.pg h1{margin:0}
.pg .lead{font-size:18px;color:var(--muted);max-width:640px;margin:14px 0 0;line-height:1.7}
.pg section{padding:38px 0;border-top:1px solid var(--line)}
.pg h2{margin:0 0 10px}
.pg p{line-height:1.85;max-width:720px;margin:0 0 12px}
.mkhead{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.mklogo{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center}
.mklogo svg{width:28px;height:28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;margin:18px 0 12px}
.kpis>div{padding:18px;border-inline-start:1px solid var(--line)}
.kpis>div:first-child{border-inline-start:0}
.kpis b{display:block;font-family:var(--f-head);font-size:30px;font-weight:500}
.kpis span{font-size:14px;color:var(--muted)}
.kpis3{grid-template-columns:repeat(3,1fr)}
.fmt3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.fmt3>div{border:1px solid var(--line);border-radius:12px;padding:18px}
.fmt3 h3{margin:0 0 6px;font-size:17px}
.fmt3 p{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.7}
.fmt3 .rate{font-weight:700;font-size:14px}
.cf{display:grid;gap:14px;max-width:560px;margin-top:14px}
.cf textarea{min-height:110px}
.pg p.hint{font-size:13px;color:var(--muted);line-height:1.7}
.prin{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.prin>div{border:1px solid var(--line);border-radius:12px;padding:18px}
.prin h3{margin:0 0 6px;font-size:16px}
.prin p{font-size:14.5px;color:var(--muted);margin:0}
.trg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.trg>div{background:var(--soft);border-radius:12px;padding:18px}
.trg b{display:block;font-size:17px;margin-bottom:6px}
.trg span{font-size:14px;color:var(--muted);line-height:1.7}
.hlinks{display:flex;gap:22px;flex-wrap:wrap;padding:26px 0 6px;border-top:1px solid var(--line);margin-top:10px}
@media(max-width:900px){.kpis,.kpis3,.fmt3,.trg{grid-template-columns:1fr 1fr}.prin{grid-template-columns:1fr}.kpis>div{border-inline-start:0;border-top:1px solid var(--line)}}
@media(max-width:560px){.kpis,.kpis3,.fmt3,.trg{grid-template-columns:1fr}}

/* v9 */
.top .btn{padding:5px 14px;min-height:32px;font-size:13px;border-radius:7px}
.langs{border-radius:7px}
.langs button{padding:5px 10px;font-size:12.5px}
.top{gap:8px;padding:12px 28px}
footer{position:fixed;bottom:0;left:200px;right:0;background:#fff;z-index:30;padding:12px 28px}
.main{padding-bottom:64px}
.side{background:var(--accent);border-color:var(--accent);color:#fff}
.side .logo{color:#fff}
.side .nav{color:#fff}
.side .nav:hover{background:rgba(255,255,255,.1)}
.side .nav.on{background:rgba(255,255,255,.18);color:#fff}
.side .tagline{color:rgba(255,255,255,.75)}
.kp{display:flex;flex-wrap:wrap;gap:10px}
.kpi{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;padding:6px 18px 6px 6px;padding-inline:6px 18px}
.kic{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.kic svg{width:17px;height:17px}
.kpi b{display:block;font-family:var(--f-head);font-size:19px;font-weight:600;line-height:1.1}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.ct2{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start;margin-top:28px;padding-top:28px;border-top:1px solid var(--line)}
.cinfo{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--soft)}
.cinfo h3{margin:0 0 12px;font-size:17px}
.ci{padding:10px 0;border-top:1px solid var(--line)}
.ci span{display:block;font-size:12.5px;color:var(--muted)}
.ci b{font-weight:600;word-break:break-word}
.ci a{text-decoration:none;color:var(--accent)}
@media(max-width:900px){footer{left:0;padding:8px 14px;font-size:12.5px}.main{padding-bottom:84px}.ct2{grid-template-columns:1fr}}

/* v10 */
.shell{flex-direction:row}
html[dir=rtl] .shell{flex-direction:row-reverse}
.side{border:0}
.top{direction:ltr;justify-content:flex-end;background:var(--accent);padding:9px 20px;position:sticky;top:0;z-index:25}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.75)}
.top .btn.fill{background:#fff;color:var(--accent);border-color:#fff}
.top .langs{border-color:rgba(255,255,255,.75)}
.top .langs button{color:#fff}
.top .langs button.on{background:#fff;color:var(--accent)}
@media(max-width:900px){.top{position:static;padding:9px 14px}}

/* v12 graphic bars */
.side{background:radial-gradient(120% 60% at 0% 100%,rgba(96,165,250,.30),transparent 60%),radial-gradient(90% 40% at 100% 0%,rgba(125,211,252,.16),transparent 60%),linear-gradient(180deg,#0d2a49 0%,#143a63 55%,#1a4676 100%)}
.side::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--wm) -190px calc(100% - 84px)/520px auto no-repeat}
.side>*{position:relative;z-index:1}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 24px;color:#fff;font-size:27px}
.lm{display:inline-flex;width:34px;height:34px}
.lm svg{width:34px;height:34px}
.side .nav{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 12px;transition:background .15s}
.side .nav .ico{display:inline-grid;place-items:center;width:30px;height:30px;margin:0;border-radius:9px;background:rgba(255,255,255,.08);color:#bcd6f2;flex:0 0 auto}
.side .nav .ico svg{width:17px;height:17px}
.side .nav.on{background:linear-gradient(90deg,rgba(255,255,255,.20),rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.side .nav.on .ico{background:#7dd3fc;color:#0d2a49}
.side .tagline{margin-top:auto;padding:14px 8px;background:none;border:0;color:#dbe9f8;font-size:13px;line-height:1.7}
.top{background:linear-gradient(90deg,#0d2a49 0%,#143a63 50%,#1d4d7f 100%);overflow:hidden;box-shadow:0 2px 14px rgba(13,42,73,.25)}
.top>*{position:relative;z-index:1}
.top .btn{border-radius:999px;padding:5px 16px}
.top .btn.fill{box-shadow:0 2px 8px rgba(0,0,0,.2)}
.top .langs{border-radius:999px;background:rgba(255,255,255,.08)}
@media(max-width:900px){.side::before{display:none}.side .nav .ico{display:none}.side .logo{padding:0 10px 0 0;font-size:24px}.lm{width:28px;height:28px}.lm svg{width:28px;height:28px}.side .nav{padding:8px 12px}}

/* v15 home background: the light world map (replace --wmh with your own image later) */
.main.hbg{background:var(--wmh) center 58%/min(96%,1150px) auto no-repeat}
.main.hbg .sec{border-top-color:rgba(17,24,39,.10)}

/* v20 classic nav */
.side .nav{border-radius:8px;border-inline-start:2px solid transparent;padding:10px 12px;letter-spacing:.01em;font-weight:400}
.side .nav .ico{background:none;width:22px;height:22px;color:#9db9dc;border-radius:0}
.side .nav .ico svg{width:19px;height:19px;stroke-width:1.35}
.side .nav:hover .ico{color:#fff}
.side .nav.on{background:rgba(255,255,255,.07);box-shadow:none;border-inline-start-color:#d6b36a;font-weight:500}
.side .nav.on .ico{background:none;color:#e6cd98}

/* v20 results: classic cards + dossier window */
.card{border-radius:14px;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 8px 24px rgba(13,42,73,.10);border-color:#c8d3e0}
.card .vd{margin-inline-start:auto;align-self:center;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.card .vd span{display:inline-block;margin-inline-start:4px;font-size:18px;line-height:1;vertical-align:-1px}
.dov{position:fixed;inset:0;z-index:60;background:rgba(10,24,41,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.dp{background:#fff;border-radius:18px;max-width:800px;width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(8,20,36,.45);overflow:hidden}
.dh{padding:24px 30px 0;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcfd,#fff)}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.dtype{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a6d2f;font-weight:700}
.dnav{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);direction:ltr}
.dn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.dn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.dn:disabled{opacity:.35;cursor:default}
.dn.dx{margin-inline-start:6px;font-size:22px}
.dh h2{font-family:var(--f-head);font-size:27px;line-height:1.3;margin:0 0 6px;font-weight:500}
.dsub{color:var(--muted);font-size:14.5px}
.dseg{display:flex;gap:2px;margin:20px -4px 0;overflow-x:auto}
.dseg button{border:0;background:none;padding:12px 16px;font-size:14px;color:var(--muted);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.dseg button:hover{color:var(--ink)}
.dseg button.on{color:var(--ink);font-weight:600;border-bottom-color:#d6b36a}
.db{padding:24px 30px 28px;overflow:auto;flex:1}

 pfNoteLive:['Information comes from OpenAlex, ORCID and official university pages. E-mails are shown only when printed on an official page or a public ORCID record. The admission status is an estimate from page text: always check the evidence link and the official page before writing.','اطلاعات از OpenAlex، ORCID و صفحه‌های رسمی دانشگاه می‌آید. ایمیل فقط وقتی نمایش داده می‌شود که در صفحه‌ی رسمی یا پروفایل عمومی ORCID چاپ شده باشد. وضعیت جذب تخمینی بر پایه‌ی متن صفحه است؛ پیش از نوشتن ایمیل، لینک مدرک و صفحه‌ی رسمی را بررسی کنید.','Bilgiler OpenAlex, ORCID ve resmi üniversite sayfalarından gelir. E-posta yalnızca resmi sayfada veya herkese açık ORCID kaydında yazıyorsa gösterilir. Alım durumu sayfa metninden yapılan bir tahmindir; yazmadan önce kanıt bağlantısını ve resmi sayfayı kontrol edin.'],

 scN:['A position is removed (not just scored lower) if it is the wrong type, in a country or region you excluded, or has less funding than you require. Language, degree, visa, residence, insurance, portfolio, pay and fee problems show up as warnings.','اگر نوع فرصت تحصیلی، کشور یا منطقه با خواسته‌ات نخواند یا فاند کمتر از حد موردنیاز باشد، فرصت تحصیلی حذف می‌شود (فقط کم‌امتیاز نمی‌شود). مشکلات زبان، مدرک، ویزا، اقامت، بیمه، پورتفولیو، حقوق و هزینه به‌صورت هشدار نشان داده می‌شوند.','Yanlış türde, hariç tuttuğun ülke/bölgede veya gereken burstan azsa pozisyon elenir (sadece puanı düşmez). Dil, derece, vize, oturum, sigorta, portfolyo, maaş ve ücret sorunları uyarı olarak gösterilir.'],
 faqT:['Questions','پرسش‌ها','Sorular'],
 faq:[['Do I need a profile to search?','برای جستجو پروفایل لازم است؟','Aramak için profil gerekli mi?','No. Search by program, university, city or country on the home page. A profile only adds ranking and warnings.','نه. در صفحه‌ی اول با برنامه، دانشگاه، شهر یا کشور جستجو کن. پروفایل فقط رتبه‌بندی و هشدار اضافه می‌کند.','Hayır. Ana sayfada program, üniversite, şehir veya ülkeye göre ara. Profil yalnızca sıralama ve uyarı ekler.'],
  ['Is my information kept confidential?','آیا اطلاعات من محرمانه می‌ماند؟','Bilgilerim gizli kalır mı?','Yes. Your profile information is used only to search for and identify study opportunities that fit your circumstances and goals. Under no circumstances is it shared with other people or organisations.','بله. اطلاعات پروفایل شما صرفاً برای جستجو و شناسایی فرصت‌های تحصیلی متناسب با شرایط و اهداف‌تان استفاده می‌شود. این اطلاعات تحت هیچ شرایطی در اختیار اشخاص یا سازمان‌های دیگر قرار نمی‌گیرد.','Evet. Profil bilgilerin yalnızca koşul ve hedeflerine uygun eğitim fırsatlarını aramak ve belirlemek için kullanılır. Bu bilgiler hiçbir koşulda başka kişi veya kurumlarla paylaşılmaz.'],
  ['How does ApplyLaunch find new sources?','ApplyLaunch منابع جدید را چگونه پیدا می‌کند؟','ApplyLaunch yeni kaynakları nasıl bulur?','ApplyLaunch is not built on a fixed list of websites. It is designed as an extensible system that can discover new sources, check them, evaluate their reliability and add them, without rebuilding the site. The goal is the widest possible coverage of trustworthy sources worldwide, so every identifiable opportunity that fits your profile can be shown.','ApplyLaunch بر پایه‌ی یک فهرست ثابت از وب‌سایت‌ها ساخته نشده است؛ یک سیستم قابل توسعه است که می‌تواند منابع جدید را شناسایی، بررسی و ارزیابی کند و به سیستم بیفزاید، بدون اینکه لازم باشد کل سایت از نو برنامه‌نویسی شود. هدف، گسترده‌ترین پوشش ممکن از منابع معتبر جهانی است تا تمام فرصت‌های قابل‌شناسایی و منطبق با شرایط شما نمایش داده شود.','ApplyLaunch sabit bir web sitesi listesine dayanmaz; yeni kaynakları bulabilen, inceleyen, güvenilirliğini değerlendiren ve siteyi baştan yazmadan sisteme ekleyebilen genişletilebilir bir sistem olarak tasarlanmıştır. Amaç, dünya genelindeki güvenilir kaynakların en geniş kapsamını sağlayarak profiline uyan tüm fırsatları göstermektir.'],
  ['What does Find a professor do?','«پیدا کردن استاد» چه می‌کند؟','«Profesör bul» ne yapar?','It finds professors who match your profile or search and shows their research areas, official pages, university email and the latest signs that they take students for a PhD, a research position or a Master’s thesis. Each professor gets one of four statuses, from clear evidence of an open position to not accepting students.','استادان مرتبط با پروفایل یا جستجوی شما را پیدا می‌کند و حوزه‌های پژوهشی، صفحه‌های رسمی، ایمیل دانشگاهی و آخرین نشانه‌های جذب دانشجو برای دکتری، موقعیت پژوهشی یا پایان‌نامه ارشد را نشان می‌دهد. هر استاد یکی از چهار وضعیت را دارد، از شواهد روشن موقعیت باز تا «فعلاً جذب ندارد».','Profilinize veya aramanıza uyan profesörleri bulur; araştırma alanlarını, resmi sayfalarını, üniversite e-postasını ve doktora, araştırma pozisyonu veya yüksek lisans tezi için öğrenci alımına dair son işaretleri gösterir. Her profesör, net kanıttan “şu an almıyor” durumuna kadar dört durumdan birine sahiptir.'],
  ['How fresh are the results?','نتایج چقدر تازه‌اند؟','Sonuçlar ne kadar güncel?','Sources are scanned regularly, and each listing links to its original ad so you can verify it.','منابع به‌صورت منظم بررسی می‌شوند و هر فرصت به آگهی اصلی خود لینک دارد تا بتوانید آن را راستی‌آزمایی کنید.','Kaynaklar düzenli taranır ve her ilan, doğrulayabilmeniz için asıl ilana bağlanır.']],

 pfIntro:['Find professors who match your profile or your search: their research areas, official pages, a university email and the latest signs that they take new students (PhD, research positions and Master’s theses). ApplyLaunch checks official professor, lab and university pages for admission signals.','استادان مرتبط با پروفایل یا جستجوی شما را پیدا کنید: حوزه‌های پژوهشی، صفحه‌های رسمی، ایمیل دانشگاهی و آخرین نشانه‌های جذب دانشجو (دکتری، موقعیت‌های پژوهشی و پایان‌نامه ارشد). ApplyLaunch صفحه‌های رسمی استاد، آزمایشگاه و دانشگاه را برای یافتن نشانه‌های جذب بررسی می‌کند.','Profilinize veya aramanıza uyan profesörleri bulun: araştırma alanları, resmi sayfalar, üniversite e-postası ve yeni öğrenci alımına dair son işaretler (doktora, araştırma pozisyonları ve yüksek lisans tezi). ApplyLaunch, alım işaretleri için resmi profesör, laboratuvar ve üniversite sayfalarını inceler.'],
 pst1:['Open position or clear evidence','شواهد روشن از جذب یا موقعیت باز','Açık pozisyon veya net kanıt'], pst2:['Welcomes enquiries','استقبال از متقاضیان','Başvurulara açık'], pst3:['Relevant, status unclear','مرتبط، وضعیت جذب نامشخص','İlgili, durum belirsiz'], pst4:['Not accepting / no direct email','فعلاً جذب ندارد / ایمیل مستقیم نمی‌پذیرد','Şu an almıyor / doğrudan e-posta yok'],
 pstD1:['There is clear evidence of student recruitment or an open position.','شواهد روشن از جذب دانشجو یا موقعیت باز وجود دارد.','Öğrenci alımına veya açık pozisyona dair net kanıt var.'], pstD2:['The professor welcomes potential applicants, but no definite position is announced.','استاد از متقاضیان بالقوه استقبال می‌کند، ولی موقعیت قطعی اعلام نشده است.','Profesör olası adayları memnuniyetle karşılıyor ancak kesin bir pozisyon duyurulmamış.'], pstD3:['The professor is relevant, but the recruitment status is unclear.','استاد مرتبط است، اما وضعیت جذب مشخص نیست.','Profesör ilgili, ancak alım durumu belirsiz.'], pstD4:['The professor states that they are not recruiting for now or do not accept direct emails.','استاد اعلام کرده فعلاً جذب ندارد یا ایمیل مستقیم را نمی‌پذیرد.','Profesör şu an alım yapmadığını veya doğrudan e-posta kabul etmediğini belirtiyor.'],
 pev1:[['The group page lists an open PhD or research position.','صفحه‌ی گروه یک موقعیت باز دکتری یا پژوهشی را فهرست کرده است.','Grup sayfasında açık bir doktora veya araştırma pozisyonu listeleniyor.'],['A recent call for students is posted on the lab website.','فراخوان تازه‌ای برای دانشجو در وب‌سایت آزمایشگاه منتشر شده است.','Laboratuvar sitesinde yakın tarihli bir öğrenci çağrısı var.'],['A funded project on the professor’s page names open student places.','پروژه‌ی فاندشده در صفحه‌ی استاد از جای خالی برای دانشجو نام برده است.','Profesörün sayfasındaki fonlu proje açık öğrenci kontenjanından söz ediyor.']],
 pev2:[['The page says prospective students are welcome to get in touch.','در صفحه نوشته شده متقاضیان بالقوه می‌توانند تماس بگیرند.','Sayfada aday öğrencilerin iletişime geçebileceği yazıyor.'],['The group invites strong applicants to send a CV and short statement.','گروه از متقاضیان قوی می‌خواهد رزومه و بیانیه‌ی کوتاه بفرستند.','Grup, güçlü adaylardan özgeçmiş ve kısa bir metin göndermesini istiyor.'],['No open position, but the page encourages enquiries about funding options.','موقعیت بازی نیست، ولی صفحه به پرسش درباره‌ی گزینه‌های فاند تشویق می‌کند.','Açık pozisyon yok ama sayfa fon seçenekleri için soru sormayı teşvik ediyor.']],
 pev3:[['No admissions note was found on the official pages.','در صفحه‌های رسمی هیچ یادداشتی درباره‌ی جذب پیدا نشد.','Resmi sayfalarda alıma dair bir not bulunamadı.'],['The research fits, but the pages say nothing about new students.','حوزه‌ی پژوهشی مرتبط است، اما صفحه‌ها درباره‌ی دانشجوی جدید چیزی نمی‌گویند.','Araştırma alanı uyuyor ama sayfalar yeni öğrenciden söz etmiyor.'],['The group page has not been updated recently.','صفحه‌ی گروه اخیراً به‌روز نشده است.','Grup sayfası yakın zamanda güncellenmemiş.']],
 pev4:[['The page says the group is not taking new students for now.','در صفحه نوشته شده گروه فعلاً دانشجوی جدید نمی‌پذیرد.','Sayfada grubun şu an yeni öğrenci almadığı yazıyor.'],['The professor asks not to be contacted directly; use the official application.','استاد خواسته مستقیم با او تماس گرفته نشود؛ از درخواست رسمی استفاده کنید.','Profesör doğrudan iletişim istemiyor; resmi başvuruyu kullanın.'],['The group is full until further notice.','ظرفیت گروه تا اطلاع بعدی پر است.','Grup bir sonraki duyuruya kadar dolu.']],

 abT:['About us','درباره ما','Hakkımızda'],
 abH:['Find study opportunities more easily.','فرصت‌های تحصیلی را آسان‌تر پیدا کنید.','Eğitim fırsatlarını daha kolay bulun.'],
 abP1:['Finding study opportunities and international scholarships should not become a complicated, time-consuming path because information is scattered or reliable sources are hard to reach.','پیدا کردن فرصت‌های تحصیلی و بورسیه‌های بین‌المللی نباید به دلیل پراکندگی اطلاعات یا دشواری دسترسی به منابع معتبر، به مسیری پیچیده و زمان‌بر تبدیل شود.','Eğitim fırsatlarını ve uluslararası bursları bulmak, bilgilerin dağınık olması ya da güvenilir kaynaklara ulaşmanın zorluğu yüzünden karmaşık ve zahmetli bir yola dönüşmemeli.'],
 abP2:['This website is an independent project that aims to make it easier for students and applicants worldwide to reach study opportunities.','این وب‌سایت یک پروژه مستقل با هدف تسهیل دسترسی دانشجویان و متقاضیان ادامه تحصیل به فرصت‌های تحصیلی در سراسر جهان است.','Bu web sitesi, dünyanın dört bir yanındaki öğrencilerin ve adayların eğitim fırsatlarına ulaşmasını kolaylaştırmayı amaçlayan bağımsız bir projedir.'],
 abP3:['By searching official university websites, faculty pages and other reliable academic sources, we collect and present study opportunities, funded positions and international scholarships, so that users can find what suits them more easily instead of searching many places separately.','ما با جست‌وجو در وب‌سایت رسمی دانشگاه‌ها، صفحات اساتید و سایر منابع معتبر علمی، فرصت‌های تحصیلی، موقعیت‌های دارای فاند و بورسیه‌های بین‌المللی را گردآوری و معرفی می‌کنیم تا کاربران بتوانند به‌جای جست‌وجوی پراکنده در منابع مختلف، فرصت‌های مناسب خود را راحت‌تر پیدا کنند.','Üniversitelerin resmi web sitelerini, akademisyen sayfalarını ve diğer güvenilir akademik kaynakları tarayarak eğitim fırsatlarını, burslu pozisyonları ve uluslararası bursları derleyip tanıtıyoruz; böylece kullanıcılar farklı yerlerde dağınık arama yapmak yerine kendilerine uygun fırsatı daha kolay bulur.'],
 abWhatT:['What do we do?','چه کاری انجام می‌دهیم؟','Ne yapıyoruz?'],
 abWhat:['Our main work is identifying, collecting and organising study opportunities at universities and research institutions. We try to publish each position with its key details and a link to the original source, so users can check further information and application conditions directly with the publisher.','فعالیت اصلی ما شناسایی، گردآوری و دسته‌بندی فرصت‌های تحصیلی در دانشگاه‌ها و مؤسسات علمی مختلف است. تلاش می‌کنیم اطلاعات هر موقعیت را همراه با جزئیات مهم و لینک منبع اصلی منتشر کنیم تا کاربران بتوانند اطلاعات تکمیلی و شرایط درخواست را مستقیماً از مرجع منتشرکننده بررسی کنند.','Asıl işimiz, üniversitelerdeki ve bilimsel kurumlardaki eğitim fırsatlarını belirlemek, toplamak ve sınıflandırmaktır. Her pozisyonu önemli ayrıntıları ve asıl kaynağın bağlantısıyla yayımlamaya çalışırız; böylece kullanıcılar ek bilgiyi ve başvuru koşullarını doğrudan yayımlayan kaynaktan kontrol edebilir.'],
 abPrT:['Our principles','اصول فعالیت ما','İlkelerimiz'],
 abPr1T:['1. Easy access to information','۱. دسترسی آسان به اطلاعات','1. Bilgiye kolay erişim'],
 abPr1D:['We try to make searching for study opportunities simpler, so users can spend more time preparing their applications.','تلاش می‌کنیم فرآیند جست‌وجو و پیدا کردن فرصت‌های تحصیلی را ساده‌تر کنیم تا کاربران بتوانند زمان بیشتری را به آماده‌سازی درخواست‌های خود اختصاص دهند.','Eğitim fırsatlarını aramayı kolaylaştırmaya çalışıyoruz; böylece kullanıcılar başvurularını hazırlamaya daha çok zaman ayırabilir.'],
 abPr2T:['2. Reliance on trusted sources','۲. اتکا به منابع معتبر','2. Güvenilir kaynaklara dayanma'],
 abPr2D:['Our priority is official university websites, faculty pages and other reliable academic sources. Wherever possible we also give users the original source of each opportunity.','اولویت ما استفاده از وب‌سایت رسمی دانشگاه‌ها، صفحات اساتید و سایر منابع معتبر علمی است. تا حد امکان، منبع اصلی هر فرصت را نیز در اختیار کاربران قرار می‌دهیم.','Önceliğimiz üniversitelerin resmi web siteleri, akademisyen sayfaları ve diğer güvenilir akademik kaynaklardır. Mümkün olduğunda her fırsatın asıl kaynağını da kullanıcılara sunarız.'],
 abPr3T:['3. Transparency','۳. شفافیت در اطلاع‌رسانی','3. Bilgilendirmede şeffaflık'],
 abPr3D:['Information about opportunities may change over time. We therefore recommend checking the conditions and details of each position at the original source before you act.','اطلاعات فرصت‌ها ممکن است با گذشت زمان تغییر کنند. به همین دلیل توصیه می‌کنیم پیش از اقدام، شرایط و جزئیات هر موقعیت را از منبع اصلی بررسی کنید.','Fırsatlara ilişkin bilgiler zamanla değişebilir. Bu nedenle işlem yapmadan önce her pozisyonun koşullarını ve ayrıntılarını asıl kaynaktan kontrol etmenizi öneririz.'],
 abPr4T:['4. Continuous development','۴. توسعه مستمر خدمات','4. Sürekli gelişim'],
 abPr4D:['This project is being developed as a practical, accessible platform. For now, everyone can use all services on the website, and we will keep improving the experience as we add features.','این پروژه با هدف ایجاد بستری کاربردی و قابل دسترس توسعه پیدا می‌کند. در حال حاضر، دسترسی به تمام خدمات ارائه‌شده در وب‌سایت برای همه آزاد است و تلاش می‌کنیم با توسعه امکانات، تجربه بهتری برای کاربران فراهم کنیم.','Bu proje, uygulanabilir ve erişilebilir bir platform olarak geliştirilmektedir. Şu an sitedeki tüm hizmetlere herkes erişebilir; özellikler ekledikçe deneyimi iyileştirmeye çalışacağız.'],
 abGoalT:['Our goal','هدف ما','Hedefimiz'],
 abGoal1:['We believe access to information about study opportunities should be simpler and fairer.','باور داریم دسترسی به اطلاعات فرصت‌های تحصیلی باید ساده‌تر و عادلانه‌تر باشد.','Eğitim fırsatlarına ilişkin bilgiye erişimin daha kolay ve daha adil olması gerektiğine inanıyoruz.'],
 abGoal2:['Our goal is an independent platform for collecting and presenting study opportunities: one that helps students learn about more opportunities, make better-informed choices and follow their academic path with a wider view.','هدف ما ایجاد بستری مستقل برای گردآوری و معرفی فرصت‌های تحصیلی است؛ بستری که به دانشجویان کمک کند فرصت‌های بیشتری را بشناسند، انتخاب‌های آگاهانه‌تری داشته باشند و مسیر تحصیلی خود را با دید بازتری دنبال کنند.','Hedefimiz, eğitim fırsatlarını derleyip tanıtan bağımsız bir platform kurmaktır; öğrencilerin daha fazla fırsat tanımasına, daha bilinçli seçimler yapmasına ve akademik yolunu daha geniş bir bakışla izlemesine yardımcı olan bir platform.'],
 abEnd:['We find and present opportunities; the choice and the final decision are yours.','ما فرصت‌ها را پیدا و معرفی می‌کنیم؛ انتخاب و تصمیم نهایی با شماست.','Fırsatları biz buluruz ve tanıtırız; seçim ve nihai karar sizindir.'],

function ieltsEq(test,s){
  s=parseFloat(s);if(!s)return null;
  const t=(test||'').toLowerCase();
  if(t.startsWith('ielts'))return s;
  const tab=t.includes('toefl')?[[110,7.5],[102,7],[94,6.5],[79,6],[60,5.5]]:t.includes('duolingo')?[[125,7],[115,6.5],[105,6],[95,5.5]]:t.includes('pte')?[[73,7.5],[65,7],[58,6.5],[50,6],[42,5.5]]:null;
  if(!tab)return null;
  for(const[a,b]of tab)if(s>=a)return b;return 5;
}

const REQTAB={'TOEFL iBT':[[7.5,110],[7,102],[6.5,94],[6,79],[5.5,60]],'Duolingo English Test':[[7,125],[6.5,115],[6,105],[5.5,95]],'PTE Academic':[[7.5,73],[7,65],[6.5,58],[6,50],[5.5,42]]};

function reqTests(pos){
 if(!pos.ielts)return [];
  const o=[{t:'IELTS',s:pos.ielts}];
  for(const k in REQTAB){const r=REQTAB[k].find(x=>pos.ielts>=x[0]);o.push({t:k,s:r?r[1]:REQTAB[k][REQTAB[k].length-1][1]})}

}
function needsGre(pos){return LIVE?!!pos.gre:pos.id%5===0}

function testCheck(pos){
  const have=P.tests.filter(t=>parseFloat(t.score));
  const req=reqTests(pos);const out={warn:[]};
  const lang=have.filter(t=>!/gre|gmat/i.test(t.test));
  if(lang.length&&req.length){
    const hit=lang.map(t=>{const r=req.find(x=>x.t.toLowerCase()===(t.test||'').toLowerCase());return r?{t:t.test,r:r.s,s:parseFloat(t.score)}:null}).filter(Boolean);
    if(hit.length){if(!hit.some(h=>h.s>=h.r)){const h=hit[0];out.warn.push(T('wTestLow').replace('{t}',h.t).replace('{r}',h.r))}}
    else out.warn.push(T('wTestNone').replace('{list}',reqText(pos)));
  }
  if(needsGre(pos)&&!have.some(t=>/gre/i.test(t.test)))out.warn.push(T('wGre'));
  return out;
}

// weights: topic 45, type 15, place 15, funding 15, other 10. Exclusions remove a position; warnings only lower "other".
function kwList(){return (P.rkw+','+P.customFields.join(',')).split(/[,،;\n]/).map(s=>s.trim().toLowerCase()).filter(s=>s.length>2)}
function topRank(){return P.edu.reduce((m,e)=>Math.max(m,levelRank(e.level)),0)}
function topicScore(posFields){
 const sel=P.fieldSel;if(!sel.length)return null;
 if(!posFields.length)return .3;
 let best=0,cnt=0;
 posFields.forEach(b=>{let m=0;sel.forEach(a=>{let r=0;
  if(a===b||b.startsWith(a+'.'))r=1;
  else if(a.startsWith(b+'.'))r=.85;
  else{const A=a.split('.'),B=b.split('.');if(A[0]===B[0])r=(A[1]&&A[1]===B[1])?.55:.25}
  if(r>m)m=r});
  if(m>0)cnt++;if(m>best)best=m});
 return best?Math.min(1,best+(cnt>1?.05:0)):0;
}
function uniAllowed(pos){
 if(!P.unis.length&&!P.topN)return true;
 const k=normU(pos.uni),rk=rankOf(pos.uni);
 if(P.topN&&rk&&rk<=P.topN)return true;
 return P.unis.some(u=>{const x=normU(u);return x&&(x===k||(x.length>=6&&(k.includes(x)||x.includes(k))))});
}
function matchOne(pos){
 const c=CBYCODE[pos.cc],why=[],warn=[];
 if(P.goals.length&&!P.goals.includes(pos.type))return null;
 if(P.countries.length){if(!P.countries.includes(pos.cc))return null}
 else if(P.regions.length&&!P.regions.includes(c[4]))return null;
 if(P.fundReq==='full'&&pos.funding!=='full')return null;
 if(P.fundReq==='partial'&&pos.funding==='none')return null;
 if(!uniAllowed(pos))return null;
 const hay=(pos.title+' '+(pos.topics||'')+' '+pos.fields.map(f=>TAXS[f]).join(' ')).toLowerCase();
 const kws=kwList(),kh=kws.some(k=>hay.includes(k));
 let topic=topicScore(pos.fields);
 if(topic===null)topic=kws.length?(kh?.8:0):.5;else if(kh)topic=Math.max(topic,.8);
 if(topic===0)return null;
 if(topic>.5)why.push(T('whyTopic'));
 let s=45*topic;
 s+=15;if(P.goals.length)why.push(T('whyType'));
 const hasPlace=P.regions.length||P.countries.length;
 s+=hasPlace?15:12;if(hasPlace)why.push(T('whyPlace'));
 if(P.unis.length||P.topN)why.push(T('whyUni'));
 s+=15*(pos.funding==='full'?1:pos.funding==='partial'?.6:0);if(pos.funding==='full')why.push(T('whyFund'));
 let o=10;
 {const tc=testCheck(pos);tc.warn.forEach(w=>{warn.push(w);o-=3})}
 const r=topRank();
 if(r&&((pos.type==='phd'&&r<3)||(pos.type==='postdoc'&&r<4)||(pos.type==='master'&&r<2))){warn.push(T('wDeg'));o-=3}
 if(P.spouse&&!c[8]&&c[5]!=='yes'){warn.push(T('wSp'));o-=2}
 if(P.res&&!c[8]&&c[6]==='no'){warn.push(T('wRes'));o-=2}
 if(P.ins&&!c[8]&&c[7]!=='covered'){warn.push(T('wIns'));o-=1}
 if(P.hasPortfolio==='no'&&pos.portfolio){warn.push(T('wPort'));o-=2}
 if(P.canProposal==='no'&&pos.proposal){warn.push(T('wProp'));o-=2}
 if(P.recs!==''){const have=P.recs==='none'?0:P.recs==='3'?3:+P.recs;if(pos.recs>have){warn.push(T('wRec').replace('{n}',fmt(pos.recs)).replace('{m}',fmt(have)));o-=2}}
 if(P.minPay&&pos.pay&&pos.pay<Number(P.minPay)){warn.push(T('wPay'));o-=3}
 if(P.maxFee!==''&&pos.fee>Number(P.maxFee)){warn.push(T('wFee'));o-=2}
 return Object.assign({},pos,{score:Math.max(5,Math.min(99,Math.round(s+Math.max(0,o)))),why,warn});
}

function cbItems(key){
 switch(key){
  case 'level':return LEVELS.map(l=>[nm(l),nm(l)]);
  case 'field':return TAX.filter(n=>n.lvl>=2).map(n=>[tn(n),n.lvl===3?tn(n)+'  ·  '+tn(TMAP[n.pid]):tn(n)]);
  case 'uni':{const seen=new Set();const out=[];QS.forEach(q=>{seen.add(normU(q.name));out.push([q.name,q.name+'  ·  #'+q.rank])});
   UNIS.forEach(u=>{const k=normU(u);if(!seen.has(k)&&!QSKEY[k]){seen.add(k);out.push([u,u])}});return out}
  case 'country':{const m={};COUNTRIES.forEach(c=>m[c[1]]=c);const names=[...new Set(WORLD.concat(COUNTRIES.map(c=>c[1])))].sort();
   return names.map(n=>{const c=m[n];return [n,c&&S.lang!=='en'?nm(c)+'  ·  '+n:n]})}
  case 'scale':return [4,5,10,20,100].map(n=>[String(n),String(n)]);

   window.location.href='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);return}
  case'pmode':S.pmode=v;S.popen=null;keep=false;break;

    if(!P.name)P.name=nm;if(!P.email)P.email=em;persist();S.modal=false}

 else if(t.dataset.pq){PQ[t.dataset.pq]=t.value;render(true)}
 else if(t.dataset.q){S.q[t.dataset.q]=t.value;if(S.screen==='explore')render(true)}
 else if(t.dataset.sort){S.sort=t.value;render(true)}
});
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.cb){
  const box=t.parentNode.querySelector('.cbl');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(box.hidden)openCb(t,false);const os=[...box.querySelectorAll('.cbo')];if(!os.length)return;let i=os.findIndex(o=>o.classList.contains('act'));os.forEach(o=>o.classList.remove('act'));i=e.key==='ArrowDown'?Math.min(os.length-1,i+1):Math.max(0,i-1);os[i].classList.add('act');os[i].scrollIntoView({block:'nearest'});return}
  if(e.key==='Enter'){e.preventDefault();const a=box.querySelector('.cbo.act');if(a)chooseCb(a);else{box.hidden=true;if(t.dataset.pick)doPick(t.dataset.pick,t)}return}
  if(e.key==='Escape'||e.key==='Tab'){box.hidden=true;return}
 }
 if(e.key==='Enter'&&t.dataset&&t.dataset.pq==='text'){render(true)}
 if(e.key==='Enter'&&t.dataset&&t.dataset.q==='text'){S.screen='explore';S.mode='search';if(S.sort==='match')S.sort='dl';render(false)}
});
/* ============================ LIVE DATA (data/positions.json) ============================
 The site loads real listings at start-up from  data/positions.json  (made from your Excel by export_positions.py).
 If the file is missing (or the page is opened from disk) the site runs in DEMO mode with the built-in samples. */
let LIVE=false,DATAINFO=null;
const FX={EUR:1,USD:.92,GBP:1.17,CHF:1.05,SEK:.09,NOK:.085,DKK:.134,CAD:.67,AUD:.6,NZD:.55,TRY:.027,PLN:.23,CZK:.04,HUF:.0025,JPY:.006,KRW:.00068,CNY:.127,SGD:.69,AED:.25,HKD:.118,MYR:.21,SAR:.245,QAR:.25,RON:.2,ISK:.0067};
const CCBYNAME=Object.fromEntries(COUNTRIES.map(c=>[c[1].toLowerCase(),c[0]]));
const hash32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)+1000};
const yn=v=>/^(yes|true|1|required)$/i.test(String(v==null?'':v).trim());
const num=v=>{const m=String(v==null?'':v).replace(/[, ]/g,'').match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):0};
function liveType(t,title){const s=(t+' '+title).toLowerCase();
 if(/post-?doc/.test(s))return'postdoc';if(/ph\.?d|doctor|dphil|promotion|doktor/.test(s))return'phd';
 if(/intern|praktik/.test(s))return'intern';if(/master|msc|m\.sc|ma\b|m\.a\./.test(s))return'master';
 if(/scholar|fellow|stipend|grant|bursary/.test(s))return'scholar';return'job'}
function inferFields(txt){txt=' '+txt.toLowerCase()+' ';const out=[];
 TAX.forEach(n=>{if(n.lvl<2)return;const nn=n.n[0].toLowerCase();if(nn.length>=5&&txt.includes(nn))out.push([n.lvl,n.id])});
 out.sort((a,b)=>b[0]-a[0]);return out.slice(0,4).map(x=>x[1])}
function liveX(type,funding,title,r){
 const deg=type==='phd'||type==='postdoc'?['phd']:type==='master'?['master']:/bachelor/i.test(title)?['bachelor']:type==='job'||type==='intern'?AL:/phd|doctor/i.test(title)?['phd']:['master'];
 const opp=type==='phd'?['phd']:type==='postdoc'?['postdoc']:type==='intern'?['intern']:type==='job'?['research']:['degree'];
 const ft=[];if(funding==='none')ft.push('self');
 else if(type==='scholar'||type==='master')ft.push('scholarship');else ft.push('employment');
 if(/fellowship/i.test(title))ft.push('fellowship');if(/research assistant|\bRA\b/i.test(title))ft.push('ra');if(/teaching assistant|\bTA\b/i.test(title))ft.push('ta');
 const cov=r&&r.unclear?'notspec':funding==='full'?'full':funding==='none'?'unfunded':'partial';
 const emp=r&&r.unclear?'notspec':funding==='none'?'unpaid':(ft.includes('employment')?'salaried':'stipend');
 return {deg,opp,ft,cov,emp};
}
function normPos(r){
 const title=String(r.title||'').replace(/^\s*\[EXAMPLE[^\]]*\]\s*/i,'').trim();if(!title)return null;
 let cc=r.cc&&CBYCODE[r.cc]?r.cc:CCBYNAME[String(r.country||'').toLowerCase().trim()];
 if(!cc&&r.cc&&r.country){cc=String(r.cc);CBYCODE[cc]=[cc,r.country,r.country,r.country,'other','?','?','?',1]}
 if(!cc)return null;
 let dl=null;if(r.deadline){const d=new Date(r.deadline);if(!isNaN(d)){const t0=new Date();t0.setHours(0,0,0,0);dl=Math.round((d-t0)/864e5);if(dl<0)return null}}
 const type=liveType(String(r.type||''),title);
 const f=String(r.funding||'').toLowerCase();
 const unclear=!f||/unclear|not stated|unknown/.test(f);
 const funding=/^full|fully/.test(f)&&!/partial|self/.test(f)?'full':/self|unfunded|none|no fund/.test(f)?'none':'partial';
 const cur=String(r.currency||'EUR').toUpperCase().trim();const fx=FX[cur]||1;
 const pay=Math.round(num(r.salary)*fx),fee=Math.round(num(r.fee)*(FX[String(r.feeCurrency||cur).toUpperCase()]||fx));
 const topics=String(r.topics||'');
 const fields=Array.isArray(r.fields)&&r.fields.length?r.fields.filter(x=>TMAP[x]):inferFields(title+' '+topics);
 const p={id:r.id&&/^\d+$/.test(String(r.id))?+r.id:hash32(String(r.url||title+(r.inst||''))),type,title,uni:String(r.inst||r.uni||'—'),city:String(r.city||'—'),cc,fields,topics,
  funding,pay,dl,ielts:num(r.ielts),years:num(r.duration),fee,seen:String(r.last_seen||r.first_seen||''),portfolio:yn(r.portfolio),proposal:yn(r.proposal),portNo:/^no$/i.test(String(r.portfolio||'').trim()),propNo:/^no$/i.test(String(r.proposal||'').trim()),feeNone:/^(none|no|0)$/i.test(String(r.fee==null?'':r.fee).trim()),recs:num(r.recs),gre:yn(r.gre),url:String(r.url||''),hub:String(r.hub||'')};
 p.x=liveX(type,funding,title,{unclear});return p;
}
async function loadData(){
 try{const cr=await fetch('config.json',{cache:'no-store'});if(cr.ok){const c=await cr.json();['email','ads','phone','api'].forEach(k=>{if(c[k])SITE[k]=c[k]})}}catch(e){}
 try{
  const ac=new AbortController();setTimeout(()=>ac.abort(),8000);const res=await fetch('data/positions.json?v='+Date.now(),{cache:'no-store',signal:ac.signal});if(!res.ok)throw 0;
  const j=await res.json();const arr=Array.isArray(j)?j:(j.positions||[]);
  const seen=new Set(),out=[];arr.forEach(r=>{const p=normPos(r);if(p&&!seen.has(p.id)){seen.add(p.id);out.push(p)}});
  if(!out.length)throw 0;
  POSITIONS=out;LIVE=true;DATAINFO={updated:Array.isArray(j)?'':String(j.updated||''),n:out.length};
  document.documentElement.classList.add('live');
 }catch(e){LIVE=false}
}
async function loadProfs(){
 try{const r=await fetch('data/professors.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();const l=(j.professors||[]).map(normProf).filter(Boolean);if(l.length){PROFL=l;PROFLIVE=true}else if(LIVE)PROFL=[]}catch(e){if(LIVE)PROFL=[]}
}
function viewProfsSoon(){return `<div class="wrap"><section class="sec" style="padding-top:20px"><h1>${T('profNav')}</h1></section><div class="empty">${T('profSoon')}</div></div>`}

loadData().then(loadProfs).then(()=>{S.saved=S.saved.filter(id=>POSITIONS.some(p=>p.id===id));render(false)});
