name: Update professors

on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applylaunch-data
  cancel-in-progress: false

jobs:
  professors:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: pip install -r crawler/requirements.txt
      - name: Validate crawler syntax
        run: python -m py_compile crawler/professors.py
      - name: Run in checkpointed batches
        shell: bash
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          MAX_INST: "40"
          PER_INST: "100"
        run: |
          set -u
          publish_checkpoint() {
            git add docs/data/professors.json crawler/prof_state.json
            if git diff --cached --quiet; then
              echo "No checkpoint changes to publish."
            else
              git commit -m "Checkpoint professor discovery $(date -u +%F-%H%M)"
            fi
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs && git push; then
                return 0
              fi
              sleep 5
            done
            echo "Could not publish professor checkpoint after 3 attempts." >&2
            return 1
          }

          for batch in 1 2 3 4; do
            echo "Starting professor discovery batch ${batch}/4"
            if python crawler/professors.py --budget-min 45; then
              run_status=0
            else
              run_status=$?
            fi
            # Publish saved progress even if the crawler exits with an error.
            publish_checkpoint || exit 1
            if [ "$run_status" -ne 0 ]; then
              echo "Crawler batch ${batch} failed with exit code ${run_status}." >&2
              exit "$run_status"
            fi
          done
      - name: Build report
        run: python crawler/report.py
