name: Update affinity (semantic scores)

# Fully automatic: runs after every data update (crawl / enrich) and once a day as a safety net.
# Adds semantic scores for new or changed opportunities to docs/data/affinity.{bin,json}. Never touches positions/text/professors.
# If anything looks wrong the run FAILS without writing; the site then keeps the previous file (new records fall back to the rule engine).
on:
  workflow_run:
    workflows: ["Update opportunities", "Enrich opportunities"]
    types: [completed]
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applylaunch-data        # shared with the data workflows: never two writers at once
  cancel-in-progress: false

jobs:
  affinity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l12-v1
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install sentence-transformers numpy
      - name: Logic tests (stub embedder)
        run: python tests/test_refresh.py | tail -2
      - name: Refresh affinity
        run: python tools/embed/refresh.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/data/affinity.bin docs/data/affinity.json tools/embed/state/affinity.crc
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Update affinity $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0 || sleep 15; done
          echo "push failed"; exit 1
