name: Discover new sources

on:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applylaunch-data        # the three data workflows never run at the same time
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt
      - name: Run
        run: |
          python crawler/discover.py
          python crawler/report.py
        env:
          # optional secrets: add them in GitHub -> Settings -> Secrets and variables -> Actions (never in the code)
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          BUDGET_MIN: "150"
          MAX_NEW: "200"
      - name: Publish data
        run: |
          git config user.name  "applylaunch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add crawler/registry.json docs/data/report.json
          git diff --cached --quiet || git commit -m "Discover new sources $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break || sleep 5; done
