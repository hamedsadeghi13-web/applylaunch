name: Enrich opportunities

# Reads the SOURCE PAGE of stored opportunities (description, admission requirements, research topics/departments) and re-judges
# what each page is (opening / programme / information / news). Works through the backlog in batches; safe to re-run.
on:
  schedule:
    - cron: "40 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applylaunch-data
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run
        run: |
          timeout -k 30 "$((BUDGET_MIN + 6))m" python crawler/crawl.py --enrich-only --enrich-max "$ENRICH_MAX" || echo "Stopped by the time limit (exit code $?) - publishing the last checkpoint"
          python crawler/report.py
          node tools/bake.js
        env:
          BUDGET_MIN: "60"
          ENRICH_MAX: "6000"
          WORKERS: "24"
          DELAY: "1.0"
      - name: Publish data
        if: always()
        run: |
          git config user.name  "applylaunch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs/data crawler/*.json
          git diff --cached --quiet || git commit -m "Enrich opportunities $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break || sleep 5; done
